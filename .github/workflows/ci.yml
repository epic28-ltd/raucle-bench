name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: astral-sh/setup-uv@0a73d6eb01c0201c8fc84847d0f4425b704ad66d
      - run: uv sync --locked --no-build --extra dev
      - run: uv run --locked --no-build ruff check src/ tests/
      - run: uv run --locked --no-build ruff format --check src/ tests/
      - run: uv run --locked --no-build pytest -q
