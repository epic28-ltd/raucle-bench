name: Weekly leaderboard run

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # contents: write is required to commit the refreshed leaderboard back
    # to main; nothing else is elevated.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@0a73d6eb01c0201c8fc84847d0f4425b704ad66d
      - name: Install with raucle-detect
        run: uv sync --locked --no-build --no-build-package fuzzysearch --extra raucle --extra llm-guard
      - name: Run benchmark
        run: uv run --locked --no-build raucle-bench
      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "raucle-bench-bot"
          git config user.email "oss@raucle.io"
          if git diff --quiet results/; then
            echo "No leaderboard changes."
            exit 0
          fi
          git add results/
          git commit -m "Weekly leaderboard run $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
