name: Weekly leaderboard run

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # contents: write is required to commit the refreshed leaderboard back
    # to main; nothing else is elevated.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@0a73d6eb01c0201c8fc84847d0f4425b704ad66d
        with:
          # 3.12: llm-guard's fuzzysearch dep ships binary wheels only for
          # cp38-cp312, which is what allows the --no-build install below.
          python-version: "3.12"
      - name: Install with raucle-detect
        run: uv sync --locked --no-build --extra raucle --extra llm-guard
      - name: Run benchmark
        run: uv run --locked --no-build raucle-bench
      - name: Commit results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "raucle-bench-bot"
          git config user.email "oss@raucle.io"
          if git diff --quiet results/; then
            echo "No leaderboard changes."
            exit 0
          fi
          BRANCH="weekly/leaderboard-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add results/
          git commit -s -m "Weekly leaderboard run $(date -u +%Y-%m-%d)"
          git push origin "HEAD:refs/heads/$BRANCH"
          # GitHub Actions needs the org setting "Allow GitHub Actions to
          # create and approve pull requests" for gh pr create to succeed.
          # Without it the run still publishes the dated branch; the pull
          # request is then opened by a maintainer on the next review pass.
          if ! gh pr create --base main --head "$BRANCH" \
            --title "Weekly leaderboard run $(date -u +%Y-%m-%d)" \
            --body "Automated refresh from scheduled run ${{ github.run_id }}. Merges when the required checks pass."; then
            echo "PR creation not permitted for GITHUB_TOKEN: branch $BRANCH is published; a maintainer opens the pull request."
          else
            gh pr merge --squash --auto
          fi
